<style>
:root{
  --bg:#fffaf7; --surface:#ffffff; --ink:#0d0d0d; --muted:#4d4a4b;
  --pink:#fe98c0; --green:#80eb3d; --blue:#3dd0eb; --red:#eb583d; --yellow:#ffd23f; --lilac:#b9a1ff;
  --border:3px solid var(--ink); --radius:18px;
  --shadow:6px 6px 0 var(--ink); --shadow-sm:4px 4px 0 var(--ink); --shadow-lg:9px 9px 0 var(--ink);
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --c:var(--pink);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16.8px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.05;margin:0;letter-spacing:-.02em}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.py{font-family:var(--body);font-weight:600}
.container{max-width:1120px;margin:0 auto;padding:0 18px}

/* header */
.header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:var(--border)}
.header__inner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
.brand{font-family:var(--display);font-weight:800;font-size:19px;text-decoration:none;background:var(--pink);border:var(--border);border-radius:10px;box-shadow:var(--shadow-sm);padding:2px 12px;white-space:nowrap}
.nav{display:flex;gap:8px}
.nav__link{text-decoration:none;font-weight:700;font-size:15px;padding:5px 14px;border:var(--border);border-radius:999px;background:var(--surface);box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.nav__link:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.nav__link.on{background:var(--ink);color:#fff}

/* hero */
.hero-wrap{padding:34px 0 30px}
.hero{background:var(--surface);border:var(--border);border-radius:27px;box-shadow:var(--shadow-lg);padding:30px;display:grid;grid-template-columns:260px 1fr;gap:34px;align-items:center}
.hero__media{position:relative;justify-self:center}
.hero__avatar{width:230px;height:260px;background:var(--surface);border:var(--border);border-radius:28px;box-shadow:var(--shadow-lg);display:grid;place-items:center;transform:rotate(-3deg);background:linear-gradient(135deg,var(--pink),var(--blue))}
.hero__avatar svg{width:52%;height:auto}
.hero__sticker,.hero__sticker2{position:absolute;font-family:var(--display);font-weight:800;border:var(--border);border-radius:999px;box-shadow:var(--shadow-sm);padding:3px 14px;white-space:nowrap}
.hero__sticker{background:var(--green);right:-18px;bottom:18px;transform:rotate(-6deg)}
.hero__sticker2{background:var(--yellow);left:-16px;top:16px;transform:rotate(-10deg)}
.hero__chip{display:inline-block;font-family:var(--display);font-weight:800;background:var(--pink);border:var(--border);border-radius:10px;box-shadow:var(--shadow-sm);padding:2px 12px}
.hero__title{font-size:clamp(56px,10vw,120px);letter-spacing:-.06em;line-height:.9;margin:16px 0 10px}
.hero__lead{font-size:19px;font-weight:500;max-width:560px;margin:0}
.hero__stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.chip{display:inline-block;font-weight:800;font-size:14px;border:var(--border);border-radius:999px;background:var(--surface);box-shadow:3px 3px 0 var(--ink);padding:3px 12px}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--display);font-weight:800;font-size:18px;padding:10px 20px;border:var(--border);border-radius:999px;background:var(--pink);box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.btn--ghost{background:var(--surface)}
.btn--sm{font-size:15px;padding:6px 14px;box-shadow:3px 3px 0 var(--ink)}

/* marquee */
.marquee{background:var(--ink);color:var(--pink);font-family:var(--display);font-weight:800;font-size:25px;overflow:hidden;white-space:nowrap;display:flex;padding:9px 0}
.marquee__track{display:flex;flex:none;animation:mq 30s linear infinite}
.marquee__track span{margin:0 14px}
.marquee__star{color:var(--green)}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-100%)}}

/* sections & cards */
.section{padding:46px 0}
.heading{font-size:clamp(34px,5vw,52px);letter-spacing:-.04em}
.lead{font-size:18px;color:var(--muted);max-width:640px;margin:10px 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.mode{display:flex;flex-direction:column;text-decoration:none;background:var(--surface);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:transform .12s,box-shadow .12s}
.mode:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--ink)}
.mode__banner{background:var(--c);border-bottom:var(--border);height:96px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.mode__emoji{font-size:48px;line-height:1}
.mode__num{font-family:var(--display);font-weight:800;font-size:44px;color:var(--surface);-webkit-text-stroke:2.5px var(--ink)}
.mode__body{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.mode__title{font-size:23px}
.mode__sum{color:var(--muted);font-size:15px;margin:6px 0 12px;flex:1}
.mode__go{font-weight:800;align-self:flex-start;border-bottom:3px solid var(--c)}
.mode__done{font-size:12px;font-weight:800;background:var(--green);border:2px solid var(--ink);border-radius:8px;padding:0 7px;margin-left:8px}

/* gym page */
.gym-head{margin-top:30px;border-radius:27px;padding:28px 24px;background:var(--c);border:var(--border);box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.gym-head__emoji{position:absolute;right:18px;bottom:-6px;font-size:130px;line-height:1;opacity:.95}
.gym-head .chip{background:var(--surface)}
.gym-head h1{font-size:clamp(42px,8vw,80px);letter-spacing:-.05em;margin:14px 0 8px;position:relative}
.gym-head p{font-size:18px;font-weight:500;max-width:620px;margin:0;position:relative}
.blk{margin-top:42px}
.blk>h2{font-size:28px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.blk>h2 .n{width:38px;height:38px;border-radius:12px;background:var(--c);border:var(--border);box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;font-size:18px;flex:none}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.word{background:var(--surface);border:var(--border);border-radius:14px;box-shadow:var(--shadow-sm);padding:10px 12px}
.word .py{font-size:20px;display:block;line-height:1.2}
.word .en{font-size:14px;color:var(--muted)}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.lesson{background:var(--surface);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.lesson h3{font-size:21px;margin-bottom:6px}
.lesson>p{margin:0 0 10px;color:var(--muted);font-size:15.5px}
.ex{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:7px 0;border-top:2px dashed var(--ink);flex-wrap:wrap}
.ex .py{font-size:18.5px}
.ex .en{color:var(--muted);font-size:14.5px}
.tip{background:var(--c);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-top:22px}
.tip strong{font-family:var(--display);font-weight:800}
.tones{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tone{background:var(--surface);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:14px;text-align:center}
.tone svg{width:70px;height:46px;display:block;margin:0 auto 6px;background:var(--bg);border:2px solid var(--ink);border-radius:10px}
.tone .big{font-size:38px;font-weight:700;display:block;line-height:1.1}
.tone .t{font-family:var(--display);font-weight:800}
.tone .en{font-size:14px;color:var(--muted)}
.games{display:grid;gap:30px}
.pager{display:flex;justify-content:space-between;gap:10px;margin:44px 0 60px;flex-wrap:wrap}
.pager a{text-decoration:none;font-family:var(--display);font-weight:800;font-size:18px;padding:10px 18px;border-radius:999px;background:var(--surface);border:var(--border);box-shadow:var(--shadow-sm);transition:transform .12s,box-shadow .12s}
.pager a:last-child{background:var(--c)}
.pager a:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}

/* games */
.game{background:var(--ink);color:#fff;border:var(--border);border-radius:27px;box-shadow:9px 9px 0 var(--c);padding:22px;position:relative;overflow:hidden}
.game h3{font-size:26px;color:var(--pink)}
.gsub{color:#d6d0d3;margin:6px 0 14px;font-size:15px}
.g-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.g-stats div{background:var(--surface);color:var(--ink);border:2px solid var(--ink);padding:3px 12px;border-radius:999px;font-weight:800;font-size:14px}
.g-center{text-align:center;padding:14px 0}
.bigscore{font-family:var(--display);font-weight:800;font-size:60px;color:var(--green);line-height:1.1}
.btn-light{border:3px solid var(--pink);background:var(--pink);color:var(--ink);font-family:var(--display);font-weight:800;font-size:18px;padding:9px 22px;border-radius:999px;box-shadow:4px 4px 0 #fff}
.btn-light:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #fff}
.q-card{background:var(--surface);color:var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--c);padding:22px 16px;text-align:center;margin:4px 0 18px}
.q-card .q{font-size:21px;font-weight:600;line-height:1.35}
.q-card .q .big{font-size:52px;font-weight:700;display:block;line-height:1.1}
.q-card .q i{color:var(--muted);font-style:normal;font-size:16px;display:block;margin-top:4px}
.q-fb{display:block;margin-top:10px;color:var(--muted);font-size:15px;min-height:22px}
.q-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.q-opts button{background:var(--surface);color:var(--ink);border:3px solid var(--surface);border-radius:16px;padding:12px 10px;font-weight:700;font-size:18px;box-shadow:4px 4px 0 var(--c);transition:transform .08s}
.q-opts button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--c)}
.q-opts button.right{background:var(--green);border-color:var(--green)}
.q-opts button.wrong{background:var(--red);border-color:var(--red)}
.timer{height:14px;background:#2a2a2a;border:2px solid #fff;border-radius:99px;overflow:hidden;margin-bottom:16px}
.timer i{display:block;height:100%;background:var(--c);width:100%;transition:width .1s linear}
.m-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.m-col{display:flex;flex-direction:column;gap:10px}
.m-col button{background:var(--surface);color:var(--ink);border:3px solid var(--surface);border-radius:14px;padding:10px 8px;font-weight:700;font-size:17px;box-shadow:3px 3px 0 var(--c);min-height:50px}
.m-col button.sel{background:var(--yellow);border-color:var(--yellow)}
.m-col button.done{background:var(--green);border-color:var(--green);opacity:.45;box-shadow:none}
.m-col button.no{background:var(--red);border-color:var(--red);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.b-en{font-size:18px;font-weight:700;margin-bottom:12px}
.b-line{min-height:58px;border:3px dashed rgba(255,255,255,.5);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.b-line.ok{border-color:var(--green);border-style:solid;background:rgba(128,235,61,.12)}
.b-line.no{border-color:var(--red);animation:shake .35s}
.b-pool{display:flex;flex-wrap:wrap;gap:10px;min-height:46px}
.tok{font-weight:700;font-size:19px;padding:5px 14px;border-radius:999px;background:var(--surface);color:var(--ink);border:3px solid var(--surface);box-shadow:3px 3px 0 var(--c)}
.b-line .tok{box-shadow:none;background:var(--yellow);border-color:var(--yellow)}
.b-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;flex-wrap:wrap}

/* real-life course */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;background:var(--surface);border:var(--border);border-radius:999px;padding:3px;box-shadow:3px 3px 0 var(--ink)}
.seg button{border:none;background:none;padding:6px 14px;border-radius:999px;font-weight:800;font-size:14px}
.seg button.on{background:var(--ink);color:#fff}
.phr{display:grid;gap:12px}
.ph{background:var(--surface);border:var(--border);border-radius:14px;box-shadow:var(--shadow-sm);padding:11px 14px}
.ph .py{font-size:19px;display:block;line-height:1.3}
.ph .en{color:var(--muted);font-size:15px}
.hide-en .en{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .2s}
.hide-en .en.show{filter:none}
.chat{background:var(--surface);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px}
.situ{align-self:center;background:var(--bg);border:var(--border);border-radius:12px;box-shadow:var(--shadow-sm);padding:6px 14px;font-weight:600;text-align:center;max-width:640px}
.ln{display:flex;flex-direction:column;align-items:flex-start;max-width:85%}
.ln.r{align-self:flex-end;align-items:flex-end}
.who{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin:0 6px 3px}
.bub{border:var(--border);border-radius:18px 18px 18px 6px;padding:9px 14px;background:var(--bg);box-shadow:3px 3px 0 var(--ink)}
.ln.r .bub{background:var(--c);border-radius:18px 18px 6px 18px}
.bub .py{font-size:19px;display:block;line-height:1.35}
.bub .en{font-size:14px;color:var(--muted);display:block}
.ln.r .bub .en{color:var(--ink);opacity:.75}
.gap{display:inline-block;min-width:70px;border-bottom:3px dashed var(--ink);text-align:center;font-weight:800;padding:0 4px}
.gap.done{background:var(--surface);border:2px solid var(--ink);border-radius:8px;padding:0 6px}
.hint{color:var(--muted);font-size:14px;font-weight:700}
.rp-opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:6px}
.opt{font-weight:700;font-size:17px;padding:6px 14px;border-radius:12px;border:var(--border);background:var(--surface);box-shadow:3px 3px 0 var(--ink)}
.opt.wrong{background:var(--red);text-decoration:line-through;animation:shake .35s}
.rp-end{text-align:center;padding:8px 0 4px}
.rp-end .big{font-family:var(--display);font-weight:800;font-size:40px}
.s-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.s-btns button{border:3px solid var(--surface);background:var(--c);color:var(--ink);border-radius:16px;padding:14px 8px;font-family:var(--display);font-weight:800;font-size:18px;box-shadow:4px 4px 0 var(--surface)}
.s-btns button.right{background:var(--green);border-color:var(--green)}
.s-btns button.wrong{background:var(--red);border-color:var(--red)}

.footer{background:var(--ink);color:var(--pink);font-family:var(--display);font-weight:800;font-size:20px;text-align:center;padding:24px 0;margin-top:30px}
@media (max-width:720px){
  .hero{grid-template-columns:1fr;padding:24px 18px;gap:26px}
  .hero__avatar{width:180px;height:200px}
  .brand{font-size:16px}
  .nav__link{font-size:14px;padding:4px 10px}
  .gym-head__emoji{font-size:90px;opacity:.5}
  .q-card .q .big{font-size:44px}
}
</style>
</head>
<body>

<header class="header">
  <div class="container header__inner">
    <a class="brand" href="#home">Chinese Gym ✦</a>
    <nav class="nav">
      <a class="nav__link" href="#gyms" data-nav="gyms">Gyms</a>
      <a class="nav__link" href="#courses" data-nav="courses">Courses</a>
    </nav>
  </div>
</header>

<main id="main"></main>

<footer class="footer">
  <div class="container">Boqkova Teach ✦ Chinese Gym · <span class="py">xuéxí hěn yǒuqù!</span></div>
</footer>

<script>
/* =====================================================================
   DATA — pinyin only (no characters). We write the tone you actually say
   for bù and yī (bú shì, yí gè), as most beginner textbooks do.
   ===================================================================== */
const TONE_LABELS = ['neutral','1st tone ˉ','2nd tone ˊ','3rd tone ˇ','4th tone ˋ'];
const TONE_SYLL = [['mā',1],['má',2],['mǎ',3],['mà',4],['ma',0],['hǎo',3],['xiè',4],['chá',2],['shū',1],['nǐ',3],['wǒ',3],['qù',4],['lái',2],['chī',1],['hē',1],['mǎi',3],['mài',4],['bā',1],['shí',2],['sì',4],['méi',2],['kàn',4],['xué',2],['jiǔ',3],['tā',1],['ne',0],['le',0],['guì',4],['nín',2],['yǒu',3]];

const GYMS = [
{
  id:'tones', emoji:'🎵', color:'var(--pink)', title:'Tone Gym', sum:'Pinyin and the four tones: the key that unlocks every Chinese word.',
  intro:'Chinese is written with characters, but learners use <b>pinyin</b> — Chinese sounds in Latin letters. Every syllable also has a <b>tone</b>: the melody of your voice. Change the tone and you change the word!',
  toneChart:true,
  lessons:[
    {t:'Syllable = sound + tone', d:'A syllable has a start (initial), an end (final) and a tone mark on top.', ex:[['m + a + ˉ = mā','mother'],['h + ao + ˇ = hǎo','good'],['x + ie + ˋ = xiè','thank']]},
    {t:'Where the tone mark goes', d:'1) on <b>a</b> or <b>e</b> if there is one; 2) on <b>o</b> in “ou”; 3) otherwise on the last vowel.', ex:[['hǎo, lái','a wins'],['xiè, méi','e wins'],['dōu','o in “ou”'],['guì, liù, duō','last vowel']]},
    {t:'Tricky letters', d:'Most letters sound like English. Watch these ones:', ex:[['x','like “sh” with a big smile: xiè'],['q','like “ch” with a big smile: qī'],['j','like “j” in “jeep”: jiā'],['zh','like “j” in “judge”, tongue back: zhè'],['c','like “ts” in “cats”: cài'],['z','like “ds” in “kids”: zài'],['ü','say “ee” with round lips: nǚ, lǜ']]},
    {t:'Tones that change', d:'Some tones change in speech. On this site we write the tone you actually say for bù and yī.', ex:[['nǐ hǎo','3 + 3 → sounds like ní hǎo'],['bù + 4th → bú','bú shì (is not)'],['yī + 4th → yí','yí gè (one)'],['yī + other → yì','yì bēi (one cup)']]}
  ],
  tip:'<strong>Don’t panic about tones.</strong> Exaggerate them at first — sing them! Natural speech is softer, but clear tones make you much easier to understand.',
  games:[
    {type:'tone', title:'Tone spotter', sub:'Look at the tone mark. Which tone is it?'},

{
  id:'sentences', emoji:'🧱', color:'var(--green)', title:'Sentence Gym', sum:'Build your first sentences: word order, shì, bù, ma and yě.',
  intro:'Chinese grammar has no verb endings, no plurals and no genders. If you can put words in the right order, you can speak!',
  words:[['shì','to be'],['bù / bú','not'],['ma','yes/no question'],['yě','also'],['xuésheng','student'],['lǎoshī','teacher'],['chá','tea'],['kāfēi','coffee']],
  lessons:[
    {t:'Word order: like English', d:'Subject – verb – object.', ex:[['wǒ hē chá.','I drink tea.'],['tā xué Zhōngwén.','She studies Chinese.']]},
    {t:'Verbs never change', d:'No “goes/went/going”. The same word for everyone.', ex:[['wǒ qù.','I go.'],['tā qù.','He goes.'],['wǒmen qù.','We go.']]},
    {t:'shì = to be (with nouns)', ex:[['wǒ shì xuésheng.','I am a student.'],['tā shì lǎoshī.','She is a teacher.']]},
    {t:'bù = not', d:'Put bù right before the verb. Before a 4th tone it becomes bú.', ex:[['wǒ bù hē kāfēi.','I don’t drink coffee.'],['wǒ bú shì lǎoshī.','I’m not a teacher.']]},
    {t:'ma = yes/no question', d:'Add ma at the end. There’s no word for “yes” — repeat the verb!', ex:[['nǐ shì xuésheng ma?','Are you a student?'],['shì. / bú shì.','Yes. / No.'],['nǐ hē chá ma?','Do you drink tea?'],['hē. / bù hē.','Yes. / No.']]},
    {t:'yě = also', d:'yě goes before the verb — never at the end.', ex:[['wǒ yě shì xuésheng.','I’m a student too.'],['tā yě hē chá.','He drinks tea too.']]}
  ],
  tip:'<strong>Remember the order:</strong> who → (yě) → (bù) → verb → what → (ma). For example: <span class="py">wǒ yě bù hē kāfēi.</span> — I don’t drink coffee either.',
  games:[
    {type:'build', title:'Build the sentence', sub:'Tap the words in the right order. Tap a word in the line to send it back.', items:[['wǒ hē chá.','I drink tea.'],['tā bú shì lǎoshī.','She is not a teacher.'],['nǐ shì xuésheng ma?','Are you a student?'],['wǒ yě xué Zhōngwén.','I study Chinese too.'],['wǒmen bù hē kāfēi.','We don’t drink coffee.'],['nǐ hē chá ma?','Do you drink tea?']]},
    {type:'quiz', title:'Which is right?', sub:'Pick the correct Chinese sentence.', items:[
      ['I don’t drink coffee.','wǒ bù hē kāfēi.',['wǒ hē bù kāfēi.','bù wǒ hē kāfēi.'],'bù goes right before the verb.'],
      ['I’m a student too.','wǒ yě shì xuésheng.',['wǒ shì xuésheng yě.','yě wǒ shì xuésheng.'],'yě goes before the verb.'],
      ['Are you a teacher?','nǐ shì lǎoshī ma?',['ma nǐ shì lǎoshī?','nǐ ma shì lǎoshī?'],'ma goes at the end.'],
      ['He drinks tea.','tā hē chá.',['tā shì hē chá.','tā chá hē.'],'Verbs never change — and don’t add shì before another verb.'],
      ['I’m not Chinese.','wǒ bú shì Zhōngguó rén.',['wǒ shì bú Zhōngguó rén.','bú wǒ shì Zhōngguó rén.'],'bù / bú goes before the verb.'],
      ['Answer “yes” to: <b>nǐ shì xuésheng ma?</b>','shì.',['ma.','bù.'],'No word for “yes” — repeat the verb.'],
      ['We study Chinese.','wǒmen xué Zhōngwén.',['wǒmen Zhōngwén xué.','xué wǒmen Zhōngwén.'],'Subject – verb – object.'],
      ['Answer “no” to: <b>nǐ hē kāfēi ma?</b>','bù hē.',['bú shì.','ma.'],'Repeat the verb with bù.']
    ]}
  ]
},

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
const store={
  get(){try{return JSON.parse(localStorage.getItem('cg-progress')||'{}')}catch(e){return {}}},
  set(k,v){try{const d=this.get();d[k]=v;localStorage.setItem('cg-progress',JSON.stringify(d))}catch(e){}},
  best(k,v){const b=this.get()[k]; if(b==null||v>b) this.set(k,v); return Math.max(b||0,v);}
};
const pad=n=>String(n).padStart(2,'0');

/* number → pinyin (0–100) */
const DIG=['líng','yī','èr','sān','sì','wǔ','liù','qī','bā','jiǔ'];
function numPy(n){
  if(n<10) return DIG[n];
  if(n===10) return 'shí';
  if(n===100) return 'yìbǎi';
  const t=Math.floor(n/10), u=n%10;
  let s=(t>1?DIG[t]:'')+'shí';
  if(u) s+=(u===2?'’':'')+DIG[u];
  return s;

/* multiple-choice quiz */
function mountQuiz(el,title,sub,items,key,nOpts){
  let deck,i,score,lock;
  const N=Math.min(10,items.length);
  function start(){deck=shuffle(items).slice(0,N);i=0;score=0;lock=false;render();}
  function render(){
    if(i>=deck.length){const b=store.best(key,score);endScreen(el,'🎯 '+title,`${score}/${deck.length}`,cheer(score,deck.length),`Best: ${b}/${deck.length}`,start);return;}
    const [q,a,d,ex]=deck[i];
    const opts=nOpts?TONE_LABELS.slice(1).concat(TONE_LABELS[0]):shuffle([a,...d]);
    el.innerHTML=`<h3>🎯 ${title}</h3><p class="gsub">${sub}</p>
      <div class="g-stats"><div>${i+1} / ${deck.length}</div><div>Score: ${score}</div></div>
      <div class="q-card"><div class="q py">${q}</div><span class="q-fb" id="fb">&nbsp;</span></div>
      <div class="q-opts">${opts.map(o=>`<button class="py" data-o="${esc(o)}">${o}</button>`).join('')}</div>`;
    el.querySelectorAll('.q-opts button').forEach(b=>b.onclick=()=>{
      if(lock) return; lock=true;
      const ok=b.dataset.o===a; if(ok) score++;
      el.querySelectorAll('.q-opts button').forEach(x=>{if(x.dataset.o===a)x.classList.add('right');else if(x===b)x.classList.add('wrong');});
      $('#fb',el).innerHTML=(ok?'✓ Correct! ':`✗ Answer: <b>${a}</b>. `)+(ex||'');
      setTimeout(()=>{i++;lock=false;render();},ok?1100:2300);
    });
  }
  start();
}

/* matching pairs, 5 at a time */
function mountMatch(el,title,sub,pairs,key){
  let deck,round,mistakes,sel,done;
  function start(){deck=shuffle(pairs);round=0;mistakes=0;render();}
  function render(){
    const set=deck.slice(round*5,round*5+5);
    if(!set.length){const best=store.get()[key];if(best==null||mistakes<best)store.set(key,mistakes);
      endScreen(el,'🧠 '+title,mistakes===0?'Perfect!':`${mistakes} mistake${mistakes>1?'s':''}`,`All ${deck.length} pairs matched.`,'',start);return;}
    sel=null;done=0;
    const L=shuffle(set.map((p,k)=>k)), R=shuffle(set.map((p,k)=>k));
    el.innerHTML=`<h3>🧠 ${title}</h3><p class="gsub">${sub}</p>
      <div class="g-stats"><div>Round ${round+1} / ${Math.ceil(deck.length/5)}</div><div>Mistakes: ${mistakes}</div></div>
      <div class="m-cols"><div class="m-col">${L.map(k=>`<button class="py" data-s="L" data-k="${k}">${set[k][0]}</button>`).join('')}</div>
      <div class="m-col">${R.map(k=>`<button data-s="R" data-k="${k}">${set[k][1]}</button>`).join('')}</div></div>`;
    el.querySelectorAll('.m-col button').forEach(b=>b.onclick=()=>{
      if(b.classList.contains('done')) return;
      if(!sel||sel.dataset.s===b.dataset.s){ if(sel) sel.classList.remove('sel'); sel=b; b.classList.add('sel'); return; }
      if(sel.dataset.k===b.dataset.k){
        [sel,b].forEach(x=>{x.classList.remove('sel');x.classList.add('done')}); sel=null; done++;
        if(done===set.length) setTimeout(()=>{round++;render();},500);
      } else {
        mistakes++; const a=sel; [a,b].forEach(x=>{x.classList.remove('sel');x.classList.add('no')});
        sel=null; setTimeout(()=>[a,b].forEach(x=>x.classList.remove('no')),450);
        el.querySelector('.g-stats div:last-child').textContent='Mistakes: '+mistakes;
      }
    });
  }
  start();
}

/* build the sentence */
function mountBuild(el,title,sub,items,key){
  let order,idx,score,placed,pool,tokens,checked,first;
  function start(){order=shuffle(items.map((_,i)=>i));idx=0;score=0;load();}
  function load(){
    if(idx>=order.length){const b=store.best(key,score);endScreen(el,'🧩 '+title,`${score}/${order.length}`,'Sentences right on the first try.',`Best: ${b}/${order.length}`,start);return;}
    tokens=items[order[idx]][0].split(' ');
    pool=shuffle(tokens.map((_,i)=>i)); if(pool.length>1&&pool.every((v,k)=>v===k)) pool.reverse();
    placed=[];checked=false;first=true;render();
  }
  function render(){
    const [py,en]=items[order[idx]];
    el.innerHTML=`<h3>🧩 ${title}</h3><p class="gsub">${sub}</p>
      <div class="b-en">“${en}”</div>
      <div class="b-line" id="bl">${placed.map(i=>`<button class="tok py" data-p="${i}">${tokens[i]}</button>`).join('')}</div>
      <div class="b-pool">${pool.map(i=>`<button class="tok py" data-i="${i}">${tokens[i]}</button>`).join('')}</div>
      <div class="b-foot"><div class="g-stats" style="margin:0"><div>${idx+1} / ${order.length}</div><div>Score: ${score}</div></div>
      <button class="btn-light" id="bnext" style="display:none">Next →</button></div>`;
    el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(checked)return;const i=+b.dataset.i;pool=pool.filter(x=>x!==i);placed.push(i);render();if(!pool.length)check();});
    el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{if(checked)return;const i=+b.dataset.p;placed=placed.filter(x=>x!==i);pool.push(i);render();});
  }
  function check(){
    const ok=placed.map(i=>tokens[i]).join(' ')===tokens.join(' '), bl=$('#bl',el);
    if(ok){checked=true;bl.classList.add('ok');if(first)score++;const n=$('#bnext',el);n.style.display='';n.onclick=()=>{idx++;load();};}
    else{first=false;bl.classList.add('no');setTimeout(()=>{pool=shuffle(placed);placed=[];render();},700);}
  }
  start();
}

/* number rush */
function mountNum(el,title,sub,key){
  const SEC=45; let score,streak,t,lock;
  function intro(){const b=store.get()[key];
    el.innerHTML=`<h3>⚡ ${title}</h3><p class="gsub">${sub}</p><div class="g-center">${b?`<div style="color:#d6d0d3">Your best: <b style="color:#fff">${b}</b></div>`:''}<button class="btn-light" style="margin-top:10px">Start</button></div>`;
    el.querySelector('button').onclick=start;}
  function start(){
    score=0;streak=0;t=SEC*10;lock=false;
    el.innerHTML=`<h3>⚡ ${title}</h3><div class="g-stats" style="margin-top:10px"><div>Score: <span id="ns">0</span></div><div>Streak: <span id="nk">0</span>🔥</div></div>
      <div class="timer"><i></i></div><div class="q-card"><div class="q py" id="nq"></div></div><div class="q-opts" id="no"></div>`;
    next();
    const id=setInterval(()=>{t--;const bar=el.querySelector('.timer i');if(!bar){clearInterval(id);return;}bar.style.width=(t/(SEC*10)*100)+'%';if(t<=0){clearInterval(id);end();}},100);
    timers.push(id);
  }
  function near(n){
    const c=new Set([n]); const cand=[n+1,n-1,n+10,n-10,(n%10)*10+Math.floor(n/10),n+2,n-2,Math.floor(Math.random()*100)];
    for(const x of shuffle(cand)){ if(c.size>=3) break; if(x>=0&&x<=100&&x!==n) c.add(x); }
    while(c.size<3) c.add(Math.floor(Math.random()*101));
    return shuffle([...c]);
  }
  function next(){
    const n=Math.random()<.15?Math.floor(Math.random()*11):Math.floor(Math.random()*101);
    const toPy=Math.random()<.5, opts=near(n);
    $('#nq',el).innerHTML=toPy?`<span class="big">${n}</span><i>in pinyin?</i>`:`<span class="big" style="font-size:38px">${numPy(n)}</span><i>which number?</i>`;
    $('#no',el).innerHTML=opts.map(o=>`<button class="py" data-v="${o}">${toPy?numPy(o):o}</button>`).join('');
    el.querySelectorAll('#no button').forEach(b=>b.onclick=()=>{
      if(lock||t<=0) return; lock=true;
      const ok=+b.dataset.v===n;
      if(ok){streak++;score+=streak>=5?2:1;b.classList.add('right');}
      else{streak=0;b.classList.add('wrong');el.querySelectorAll('#no button').forEach(x=>{if(+x.dataset.v===n)x.classList.add('right')});}
      $('#ns',el).textContent=score;$('#nk',el).textContent=streak;
      setTimeout(()=>{lock=false;if(t>0)next();},ok?280:900);
    });
  }
  function end(){const b=store.best(key,score);endScreen(el,'⚡ '+title,score,score>=20?'Amazing speed! 🚀':score>=10?'Great job! hěn hǎo!':'Keep training! jiāyóu!','Best: '+b,start);}
  intro();
}

function mountRoleplay(el,s){
  const rp=s.rp; let step,mistakes,filled;
  function start(){step=0;mistakes=0;filled={};render();}
  function render(){
    while(step<rp.lines.length&&(!rp.lines[step][2]||filled[step])) step++;
    let html=`<div class="situ">🎭 ${rp.situ}</div>`;
    for(let k=0;k<rp.lines.length&&k<=step;k++){
      const l=rp.lines[k], you=l[0]===1; let txt=l[1];
      if(l[2]){ txt=txt.replace('___',filled[k]?`<span class="gap done">${l[2]}</span>`:`<span class="gap">?</span>`); if(l[5]&&!filled[k]) txt+=` <span class="hint">(${l[5]})</span>`; }
      html+=`<div class="ln ${you?'r':''}"><div class="who">${you?'You':rp.them}</div><div class="bub"><span class="py">${txt}</span>${l[2]&&filled[k]?`<span class="en">${l[4]}</span>`:''}</div>`;
      if(k===step&&l[2]) html+=`<div class="rp-opts">${shuffle(l[3]).map(o=>`<button class="opt py" data-o="${esc(o)}">${o}</button>`).join('')}</div>`;
      html+='</div>';
    }
    if(step>=rp.lines.length){
      const p=store.get()['rp-'+s.id]; if(p==null||mistakes<p) store.set('rp-'+s.id,mistakes);
      html+=`<div class="rp-end"><div class="big">${mistakes===0?'tài bàng le! 🎉':mistakes<=2?'hěn hǎo! 👏':'jiāyóu! 💪'}</div><div>${mistakes===0?'No mistakes — perfect!':`${mistakes} mistake${mistakes>1?'s':''}. Try again for a perfect score!`}</div><button class="btn btn--sm" style="margin-top:12px">↺ Play again</button></div>`;
    }
    el.innerHTML=html;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(b.dataset.o===rp.lines[step][2]){filled[step]=true;step++;render();}
      else{mistakes++;b.classList.add('wrong');b.disabled=true;}
    });
    const end=el.querySelector('.rp-end .btn'); if(end) end.onclick=start;
  }
  start();
}
function mountSort(el,g,key){
  let deck,i,score,lock;
  function start(){deck=shuffle(g.items).slice(0,10);i=0;score=0;lock=false;render();}
  function render(){
    if(i>=deck.length){const b=store.best(key,score);endScreen(el,'🎯 '+g.title,`${score}/${deck.length}`,cheer(score,deck.length),`Best: ${b}/${deck.length}`,start);return;}
    const c=deck[i];
    el.innerHTML=`<h3>🎯 ${g.title}</h3><p class="gsub">${g.sub}</p><div class="g-stats"><div>${i+1} / ${deck.length}</div><div>Score: ${score}</div></div>
      <div class="q-card"><div class="q py" style="font-size:26px">${c[0]}</div><span class="q-fb" id="sf">&nbsp;</span></div>
      <div class="s-btns">${g.labels.map((l,k)=>`<button data-k="${k}">${l}</button>`).join('')}</div>`;
    el.querySelectorAll('.s-btns button').forEach(b=>b.onclick=()=>{
      if(lock)return;lock=true;const ok=+b.dataset.k===c[2];if(ok)score++;
      el.querySelectorAll('.s-btns button').forEach(x=>{if(+x.dataset.k===c[2])x.classList.add('right');else if(x===b)x.classList.add('wrong');});
      $('#sf',el).innerHTML=(ok?'✓ ':'✗ ')+c[1];
      setTimeout(()=>{i++;lock=false;render();},ok?1100:2000);
    });
  }
  start();
}

/* =================== BIG REVIEW =================== */
function reviewView(){
  return `<div class="container"><div class="gym-head" style="--c:var(--lilac)"><span class="gym-head__emoji">🏆</span><span class="chip">Course ${pad(GYMS.length+2)}</span><h1>The big review</h1><p>15 random questions from every gym. Play it again and again — the questions change every time.</p></div>
    <section class="blk"><div class="games"><div class="game" id="rv" style="--c:var(--lilac)"></div></div></section>
    <div class="pager"><a href="#life">← Chinese for real life</a><a href="#home" style="--c:var(--pink)">All gyms →</a></div></div>`;
}
function mountReview(){
  const all=[];
  GYMS.forEach(g=>g.games.forEach(x=>{ if(x.type==='quiz') x.items.forEach(it=>all.push(it)); }));
  TONE_SYLL.forEach(([s,t])=>all.push([`<span class="big">${s}</span><i>Which tone?</i>`,TONE_LABELS[t],shuffle(TONE_LABELS.filter((_,j)=>j!==t)).slice(0,2),'']));
  const el=$('#rv'); let deck,i,score,lock;
  function start(){deck=shuffle(all).slice(0,15);i=0;score=0;lock=false;render();}
  function render(){
    if(i>=deck.length){const b=store.best('review',score);endScreen(el,'🏆 The big review',`${score}/15`,cheer(score,15),`Best: ${b}/15`,start);return;}
    const [q,a,d,ex]=deck[i];
    el.innerHTML=`<h3>🏆 The big review</h3><div class="g-stats" style="margin-top:10px"><div>${i+1} / 15</div><div>Score: ${score}</div></div>
      <div class="q-card"><div class="q py">${q}</div><span class="q-fb" id="fb">&nbsp;</span></div>
      <div class="q-opts">${shuffle([a,...d]).map(o=>`<button class="py" data-o="${esc(o)}">${o}</button>`).join('')}</div>`;
    el.querySelectorAll('.q-opts button').forEach(b=>b.onclick=()=>{
      if(lock)return;lock=true;const ok=b.dataset.o===a;if(ok)score++;
      el.querySelectorAll('.q-opts button').forEach(x=>{if(x.dataset.o===a)x.classList.add('right');else if(x===b)x.classList.add('wrong');});
      $('#fb',el).innerHTML=(ok?'✓ Correct! ':`✗ Answer: <b>${a}</b>. `)+(ex||'');
      setTimeout(()=>{i++;lock=false;render();},ok?1100:2300);
    });
  }
  start();
}

/* =================== ROUTER =================== */
function route(){
  clearTimers();
  const h=(location.hash||'#home').slice(1), main=$('#main');
  let scrollTo=null, navOn='';
  const gi=GYMS.findIndex(g=>'g-'+g.id===h), li=LIFE.findIndex(s=>'life-'+s.id===h);
  if(gi>=0){ main.innerHTML=gymView(GYMS[gi],gi); mountGym(GYMS[gi]); navOn='gyms'; }
  else if(li>=0){ main.innerHTML=lifeView(LIFE[li],li); mountLife(LIFE[li]); navOn='courses'; }
  else if(h==='life'){ main.innerHTML=lifeIndex(); navOn='courses'; }
  else if(h==='review'){ main.innerHTML=reviewView(); mountReview(); navOn='courses'; }
  else { main.innerHTML=homeView(); if(h==='gyms'||h==='courses'){scrollTo='sec-'+h; navOn=h;} }
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===navOn));
  if(scrollTo){ const t=document.getElementById(scrollTo); const y=t.getBoundingClientRect().top+window.scrollY-80; window.scrollTo({top:y,behavior:'instant'}); }
  else window.scrollTo({top:0,behavior:'instant'});
}
window.addEventListener('hashchange',route);
route();
</script>
